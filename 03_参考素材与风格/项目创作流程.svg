<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc">
<title id="title">AIGC_Lab 创作流程</title>
<desc id="desc">想法需求、剧本、人物道具场景参考图与人物音色提示词、完整调度与逐Shot声音BGM、Clip编译；各节点承接当前作品脉络，交付后由用户调整并调用下一节点，用户在LibTV生成和验收。拉片和行为验证反向改进项目Skill。15个节点，18条连线。</desc>
